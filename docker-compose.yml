version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos-mobile-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/pos_mobile.db
      - DATA_DIR=/data
      - CORS_ORIGINS=["http://localhost:8080","http://localhost:8000","file://","null"]
      - DEBUG=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/sync/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Frontend static file server (nginx)
  frontend:
    image: nginx:alpine
    container_name: pos-mobile-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # Optional: Database backup service
  backup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos-mobile-backup
    restart: "no"
    profiles:
      - backup
    volumes:
      - backend-data:/data
      - ./backup:/backup
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/pos_mobile.db
    command: >
      sh -c "
        python3 -c '
import sqlite3, json, datetime, os
conn = sqlite3.connect(\"/data/pos_mobile.db\")
conn.row_factory = sqlite3.Row
cursor = conn.cursor()
tables = [\"products\",\"sales\",\"sale_items\",\"purchases\",\"purchase_items\",
          \"debts\",\"debt_payments\",\"expenses\",\"stock_movements\",
          \"hold_bills\",\"settings\",\"category_mappings\"]
data = {}
for t in tables:
    cursor.execute(f\"SELECT * FROM {t}\")
    data[t] = [dict(row) for row in cursor.fetchall()]
ts = datetime.datetime.utcnow().strftime(\"%Y%m%d_%H%M%S\")
with open(f\"/backup/pos_mobile_backup_{ts}.json\", \"w\") as f:
    json.dump({\"timestamp\": ts, \"version\": \"1.0.0\", \"data\": data}, f, ensure_ascii=False, indent=2)
print(f\"Backup saved to /backup/pos_mobile_backup_{ts}.json\")
        '
      "

volumes:
  backend-data:
    driver: local