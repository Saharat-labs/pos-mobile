version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos-mobile-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/pos_mobile.db
      - DATA_DIR=/data
      - CORS_ORIGINS=["http://localhost:8080","http://localhost:8000","file://","null"]
      - DEBUG=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/sync/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Frontend static file server (nginx)
  frontend:
    # Image copies only the frontend files, so the repo (.git, backend/.env, *.db) is never served.
    # Rebuild after frontend changes: docker compose build frontend
    build:
      context: .
      dockerfile: nginx.Dockerfile
    container_name: pos-mobile-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Optional: Database backup service
  backup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos-mobile-backup
    restart: "no"
    profiles:
      - backup
    volumes:
      - backend-data:/data
      - ./backup:/backup
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/pos_mobile.db
    command: ["python", "scripts/backup_db.py"]

volumes:
  backend-data:
    driver: local